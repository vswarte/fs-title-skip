[package]
name = "fromsoftware-title-skip"
version = "0.2.1"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
broadsword = { git = "https://github.com/vswarte/broadsword.git" }
retour = { version = "0.3", features = ["static-detour"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "z"
